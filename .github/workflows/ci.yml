name: Prebuilt Haxe SDK
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
defaults:
  run:
    shell: bash
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: python3 scripts/third_party_notices.py --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 -c 'import subprocess; subprocess.run(["cargo", "test", "--workspace", "--locked"], timeout=600, check=True)'
      - run: haxelib install formatter 1.18.0 --always --quiet
      - run: haxelib run formatter --check -s sources -s examples -s tests/assets -s tests/release
      - name: Generated package layout matches source
        run: |
          hxn package hl cpp --release --out .
          changed="$(git status --porcelain --untracked-files=all -- binding include haxelib.json extraParams.hxml text.hxn.json)"
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- binding include haxelib.json extraParams.hxml text.hxn.json
            exit 1
          fi
  package:
    name: package, ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-x86_64}
          - {os: ubuntu-24.04-arm, name: linux-aarch64}
          - {os: macos-latest, name: macos-aarch64}
          - {os: windows-latest, name: windows-x86_64}
          - {os: macos-latest, name: macos-x86_64, runtimes: cpp, target: x86_64-apple-darwin}
          - {os: macos-latest, name: ios, runtimes: hl cpp, target: aarch64-apple-ios}
          - {os: macos-latest, name: ios-simulator, runtimes: hl cpp, target: aarch64-apple-ios-sim}
          - {os: ubuntu-latest, name: android, runtimes: hl cpp, target: aarch64-linux-android}
          # Keep wasm libraries on the same pinned Linux producer as the file/assets SDKs.
          - {os: ubuntu-latest, name: ash-wasm, runtimes: hl, wasm: true}
          - {os: ubuntu-latest, name: ash-wasm-threads, runtimes: hl, wasm: true, threads: true}
          - {os: ubuntu-latest, name: emcc-wasm, runtimes: cpp, wasm: true, emcc: true}
          - {os: ubuntu-latest, name: emcc-wasm-threads, runtimes: cpp, wasm: true, threads: true, emcc: true}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - if: matrix.name == 'android'
        run: |
          ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$ndk/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ndk/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
      - if: matrix.emcc
        run: |
          rustup target add wasm32-unknown-emscripten
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.7
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.7
      - name: Build platform binaries for the Haxelib
        run: |
          if [ -f "$RUNNER_TEMP/emsdk/emsdk_env.sh" ]; then source "$RUNNER_TEMP/emsdk/emsdk_env.sh"; fi
          python3 -c 'import subprocess,sys; subprocess.run(["hxn","package",*sys.argv[1:]], timeout=3000, check=True)' ${{ matrix.runtimes || 'hl cpp' }} --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }} ${{ matrix.wasm && '--wasm' || '' }} ${{ matrix.threads && '--threads' || '' }} --out target/release-part
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: target/release-part
          if-no-files-found: error
  haxelib:
    needs: [checks, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: target/release-parts
      - run: python3 tests/release/package.py
      - name: Release validation rejects missing platforms and altered API files
        run: python3 tests/release/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: haxelib
          path: target/release-dist/*
          if-no-files-found: error
  native:
    name: installed, ${{ matrix.os }}
    needs: haxelib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/setup
            examples
            tests/release
            tests/fixtures
            tests/assets
      - uses: ./.github/actions/setup
        with:
          producer: 'false'
          runtime: native
      - uses: actions/download-artifact@v4
        with:
          name: haxelib
          path: target/release-dist
      - if: (runner.os == 'Linux' && runner.arch != 'ARM64') || runner.os == 'Windows'
        run: python3 tests/release/run.py native --hl hl
      - if: runner.os == 'macOS' || (runner.os == 'Linux' && runner.arch == 'ARM64')
        run: python3 tests/release/run.py native
  browser:
    name: installed, ${{ matrix.mode }}, Chrome
    needs: haxelib
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [wasm, wasm-threads, emcc, emcc-threads]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/setup
            examples
            tests/release
            tests/fixtures
            tests/assets
      - uses: ./.github/actions/setup
        with:
          producer: 'false'
          runtime: browser
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: haxelib
          path: target/release-dist
      - run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.7
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.7
      - run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python3 tests/release/run.py "${{ matrix.mode }}" --chrome "$(command -v google-chrome)"
  publish:
    needs: [native, browser]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6
      - uses: actions/download-artifact@v4
        with:
          name: haxelib
          path: target/release-dist
      - name: Publish the verified prebuilt Haxelib
        env:
          GH_TOKEN: ${{ github.token }}
          HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
        run: python3 tests/release/publish.py --tag "$GITHUB_REF_NAME"
