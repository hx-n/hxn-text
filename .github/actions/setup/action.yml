name: SDK tools
description: Haxe runtimes and optional Rust producer tools for SDK generation.
inputs:
  producer:
    description: Install Rust and the matching hxn CLI for building the native SDK
    default: 'true'
  runtime:
    description: package, native or browser
    default: package
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - if: inputs.producer == 'true'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-08-25
        components: rust-src, rustfmt, clippy
    - if: inputs.producer == 'true'
      uses: Swatinem/rust-cache@v2
    - if: runner.os == 'Windows' || (runner.os == 'Linux' && runner.arch != 'ARM64')
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.6
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install haxe
        mkdir -p "$HOME/haxelib"
        haxelib setup "$HOME/haxelib"
    - if: runner.os == 'Linux' && runner.arch == 'ARM64'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y haxe
        mkdir -p "$HOME/haxelib"
        haxelib setup "$HOME/haxelib"
    - if: inputs.runtime == 'native' || inputs.runtime == 'browser'
      shell: bash
      run: |
        haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp --quiet
        dir="$(haxelib libpath hxcpp)"
        git -C "$dir" checkout -q 615adc73d5ef28f3f74ea47977c39c4f25ce256d
        (cd "$dir/tools/hxcpp" && haxe compile.hxml)
    - if: inputs.runtime == 'native' && runner.os == 'Linux'
      shell: bash
      run: |
        git clone --depth 1 --branch 1.15 https://github.com/HaxeFoundation/hashlink "$RUNNER_TEMP/hashlink"
        make -C "$RUNNER_TEMP/hashlink" libhl hl
        echo "$RUNNER_TEMP/hashlink" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/hashlink${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
    - if: runner.os == 'Windows'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        temp="$(cygpath -u "$RUNNER_TEMP")"
        gh release download 1.15 --repo HaxeFoundation/hashlink --pattern '*-win.zip' --dir "$temp"
        unzip -q "$temp"/*-win.zip -d "$temp/hl"
        dir="$(dirname "$(find "$temp/hl" -name hl.exe | head -1)")"
        cygpath -w "$dir" >> "$GITHUB_PATH"
        echo "HXN_HL_DIR=$(cygpath -w "$dir")" >> "$GITHUB_ENV"
    - if: inputs.runtime == 'native' || inputs.runtime == 'browser'
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux) archive=ash-linux-$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64).tar.gz ;;
          macOS) archive=ash-macos-aarch64.tar.gz ;;
          Windows) archive=ash-windows-x86_64.tar.gz ;;
        esac
        mkdir -p "$RUNNER_TEMP/ash"
        (cd "$RUNNER_TEMP/ash" && curl -fsSL "https://github.com/rayzor-blade/ash/releases/download/v0.1.21/$archive" | tar -xz)
        if [ "$RUNNER_OS" = Windows ]; then
          cygpath -w "$RUNNER_TEMP/ash" >> "$GITHUB_PATH"
        else
          echo "$RUNNER_TEMP/ash" >> "$GITHUB_PATH"
        fi
    - if: inputs.producer == 'true'
      shell: bash
      run: |
        tag="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["dependencies"]["hxn"]["tag"])')"
        cargo install --git https://github.com/hx-n/hxn.git --tag "$tag" --locked hxn-cli
        hxn version
